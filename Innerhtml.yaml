id: test-xss

info:
  name: Test XSS Simple
  author: tatsu
  severity: medium
  description: Test simple para verificar que Nuclei funciona
  tags: xss,test

http:
  - method: GET
    path:
      - "{{BaseURL}}/?q={{payload}}"

    payloads:
      payload:
        - '"><u>teste'

    matchers:
      - type: word
        part: body
        words:
          - "<u>teste"
EOF
